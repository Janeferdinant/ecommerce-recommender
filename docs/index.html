<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recommender Demo</title>
<meta name="description" content="Pick a sample customer or a few items and compare top-10 recommendations from up to eight recommenders on two public datasets, with a panel that explains why each item was suggested.">
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2327; --muted: #5d676e; --line: #dcdad2;
  --accent: #1f5f5b; --accent-ink: #ffffff; --chip: #e6efed; --focus: #b4530a; --bar: #7fb8b2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14181a; --panel: #1c2225; --ink: #e8ecee; --muted: #a2adb3; --line: #323b40;
    --accent: #6cc3bb; --accent-ink: #0d1a19; --chip: #25363a; --focus: #f0a05a; --bar: #3f857e; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
.tabs { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); margin-right: 8px; margin-bottom: 8px; }
.tabs button { border: 0; background: transparent; color: var(--ink); padding: 10px 18px; font: inherit; cursor: pointer; min-height: 44px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; }
.panel h2 { font-size: 1rem; margin: 0 0 10px; }
label { display: block; font-weight: 600; margin-bottom: 6px; }
select, input[type="search"] { width: 100%; max-width: 420px; min-height: 44px; padding: 8px 12px; font: inherit;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; }
.chip { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 6px; }
.chip button { border: 0; background: transparent; color: inherit; cursor: pointer; font: inherit; padding: 4px 6px; min-height: 28px; }
.muted { color: var(--muted); font-size: 0.9rem; }
.hits { list-style: none; margin: 8px 0 0; padding: 0; max-width: 420px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.hits:empty { display: none; }
.hits button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--panel);
  color: var(--ink); padding: 10px 12px; font: inherit; cursor: pointer; min-height: 44px; }
.hits li:last-child button { border-bottom: 0; }
.hits button:hover { background: var(--chip); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; min-height: 44px; }
details.models summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.model-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 16px; margin: 4px 0 0; padding: 0; list-style: none; }
.model-list label { display: flex; gap: 8px; align-items: center; font-weight: 400; min-height: 36px; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card h3 { margin: 0; font-size: 1.05rem; }
.card .sub { color: var(--muted); font-size: 0.875rem; margin: 2px 0 12px; }
.recs { list-style: none; margin: 0; padding: 0; }
.recs > li { border-top: 1px solid var(--line); }
.rec-btn { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: 0 8px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
  font: inherit; padding: 9px 0; min-height: 44px; cursor: pointer; align-items: start; }
.rec-btn .rank { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.rec-btn .nm { font-weight: 600; overflow-wrap: anywhere; }
.rec-btn .code { display: block; color: var(--muted); font-size: 0.85rem; font-weight: 400; }
.rec-btn .why-tag { color: var(--accent); font-size: 0.85rem; white-space: nowrap; padding-top: 2px; }
.explain { margin: 0 0 10px 1.6rem; padding: 10px 12px; background: var(--chip); border-radius: 8px; font-size: 0.9rem; }
.explain p { margin: 0 0 6px; }
.explain .src { display: grid; grid-template-columns: minmax(0, 1fr) 3.2rem; gap: 2px 8px; align-items: center; margin: 4px 0; }
.explain .src span { overflow-wrap: anywhere; }
.explain .track { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.explain .fill { display: block; height: 100%; background: var(--bar); }
.empty { color: var(--muted); padding: 24px 0; }
footer { margin-top: 28px; color: var(--muted); font-size: 0.85rem; max-width: 80ch; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Recommender demo</h1>
  <p class="lede">Compare what the recommenders suggest for the same shopper or the same picks, on two public datasets. Select any suggestion to see why it was recommended.</p>

  <div class="tabs" role="tablist" aria-label="Dataset">
    <button role="tab" id="ds-retail" aria-selected="true">Online shop</button>
    <button role="tab" id="ds-books" aria-selected="false">Books</button>
  </div>
  <div class="tabs" role="tablist" aria-label="Demo mode" id="mode-tabs">
    <button role="tab" id="tab-customer" aria-selected="true" aria-controls="mode-customer">Sample customer</button>
    <button role="tab" id="tab-picker" aria-selected="false" aria-controls="mode-picker">Pick items</button>
  </div>
  <p class="muted" id="status" role="status"></p>

  <section class="panel" id="mode-customer" role="tabpanel" aria-labelledby="tab-customer">
    <label for="customer">Sample customer</label>
    <select id="customer"></select>
    <p class="muted" id="customer-meta"></p>
    <h2>Recent purchases</h2>
    <ul class="chips" id="history"></ul>
  </section>

  <section class="panel" id="mode-picker" role="tabpanel" aria-labelledby="tab-picker" hidden>
    <label for="search" id="search-label">Search products</label>
    <input type="search" id="search" autocomplete="off">
    <ul class="hits" id="hits"></ul>
    <h2 style="margin-top:14px" id="basket-title">Your basket <span class="muted" id="basket-count"></span></h2>
    <ul class="chips" id="basket"></ul>
    <div class="row" id="presets"></div>
  </section>

  <details class="panel models" id="model-panel">
    <summary>Choose which recommenders to show</summary>
    <ul class="model-list" id="model-list"></ul>
  </details>

  <div id="results" class="grid" aria-live="polite"></div>

  <footer id="footer"></footer>
</div>

<script src="demo-data.js"></script>
<script>
(function () {
  "use strict";
  var MAX_BASKET = 8, TOP_K = 10;
  var $ = function (id) { return document.getElementById(id); };

  var MODELS = [
    { key: "popularity", title: "Popularity baseline", sub: "The best sellers overall; the same list for everyone." },
    { key: "itemknn", title: "Item-based collaborative filtering", sub: "Items that the same people picked (cosine similarity)." },
    { key: "itemknn_recency", title: "Item-based CF, recency-weighted", sub: "The same idea, but recent activity counts more than old activity." },
    { key: "copurchase", title: "Co-purchase", sub: "Items that appeared together in the same basket, with a minimum support rule." },
    { key: "copurchase_price", title: "Co-purchase with price-aware re-ranking", sub: "Co-purchase scores multiplied by a price factor, a business rule." },
    { key: "als", title: "Matrix factorisation (ALS)", sub: "Learned taste factors from implicit data, solved by alternating least squares." },
    { key: "ease", title: "EASE", sub: "A linear item-to-item model learned in closed form." },
    { key: "bpr", title: "Matrix factorisation (BPR)", sub: "Taste factors learned to rank items a person picked above ones they did not." }
  ];
  var DATASETS = {
    retail: { tab: "ds-retail", get: function () { return window.DEMO_DATA; }, file: null,
      verb: "bought", noun: "products", search: "Search products", placeholder: "e.g. lantern, cake, heart",
      basket: "Your basket", source: "Because you bought",
      footer: "Online shop: UCI Online Retail II (CC BY 4.0), a UK gift retailer's 2009 to 2011 sales. Models were trained on the earlier part of the sales history. Sample customers are anonymous labels; no customer identifiers are shown." },
    books: { tab: "ds-books", get: function () { return window.DEMO_DATA_BOOKS; }, file: "demo-data-books.js",
      verb: "rated", noun: "books", search: "Search books", placeholder: "e.g. hunger games, pride, ring",
      basket: "Your picks", source: "Because you rated",
      footer: "Books: Goodbooks-10k by Zygmunt Zając (CC BY-SA 4.0, https://github.com/zygmuntz/goodbooks-10k), ratings of ten thousand popular books collected from Goodreads. This page embeds an excerpt of it (600 book titles and numbers derived by the models), which is licensed CC BY-SA 4.0 separately from the rest of this repository; changes were made (selection and derived scores). The models were trained on a seeded sample of 8,000 users; every rating counts as an interaction." }
  };
  var state = { ds: "retail", D: null, mode: "customer", basket: [], enabled: {} };
  MODELS.forEach(function (m) { state.enabled[m.key] = true; });

  var nameOf = function (i) { return state.D.items[i][1]; };
  var codeOf = function (i) { return state.D.items[i][0]; };

  // ---- recommendation maths for the picker (mirrors src/ecomrec/demo_ref.py) ----
  function solve(A, b) {
    var n = b.length, M = A.map(function (r, i) { return r.slice().concat([b[i]]); });
    for (var c = 0; c < n; c++) {
      var p = c;
      for (var r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      var t = M[c]; M[c] = M[p]; M[p] = t;
      for (var r2 = c + 1; r2 < n; r2++) {
        var f = M[r2][c] / M[c][c];
        for (var k = c; k <= n; k++) M[r2][k] -= f * M[c][k];
      }
    }
    var x = new Array(n);
    for (var i = n - 1; i >= 0; i--) {
      var s = M[i][n];
      for (var j = i + 1; j < n; j++) s -= M[i][j] * x[j];
      x[i] = s / M[i][i];
    }
    return x;
  }
  function byScoreDesc(scores) {
    var idx = scores.map(function (_, i) { return i; });
    idx.sort(function (a, b) { return scores[b] - scores[a] || a - b; });
    return idx;
  }
  function shares(sources, values) {
    var pairs = [];
    sources.forEach(function (s, i) { if (values[i] > 0) pairs.push([s, values[i]]); });
    pairs.sort(function (a, b) { return b[1] - a[1] || a[0] - b[0]; });
    pairs = pairs.slice(0, 3);
    var total = pairs.reduce(function (a, p) { return a + p[1]; }, 0);
    return total > 0 ? pairs.map(function (p) { return [p[0], Math.round(p[1] / total * 100) / 100]; }) : [];
  }
  function neighbourRecs(lists, sel, n, weights) {
    var isChosen = {}; sel.forEach(function (c) { isChosen[c] = true; });
    var scores = new Array(n).fill(0), contrib = {};
    sel.forEach(function (c) {
      lists[c].forEach(function (e) {
        var j = e[0], s = e[1];
        if (isChosen[j]) return;
        scores[j] += s;
        if (!contrib[j]) contrib[j] = [];
        contrib[j].push([c, s]);
      });
    });
    var fin = weights ? scores.map(function (s, j) { return s * weights[j]; }) : scores;
    var order = byScoreDesc(fin).filter(function (j) { return fin[j] > 0; }).slice(0, TOP_K);
    var recs = order.map(function (j) {
      var rec = { i: j, w: shares(contrib[j].map(function (x) { return x[0]; }), contrib[j].map(function (x) { return x[1]; })) };
      if (weights) rec.f = weights[j];
      return rec;
    });
    var used = {}; order.forEach(function (j) { used[j] = true; });
    for (var q = 0; q < n && recs.length < TOP_K; q++) if (!isChosen[q] && !used[q]) {
      var rec2 = { i: q, w: [] };
      if (weights) rec2.f = weights[q];
      recs.push(rec2);
    }
    return recs;
  }
  function unitCosShares(F, sel, j) {
    var norm = function (v) { return Math.sqrt(v.reduce(function (a, x) { return a + x * x; }, 0)) || 1e-12; };
    var cos = function (a, b) { var s = 0; for (var i = 0; i < F[a].length; i++) s += F[a][i] * F[b][i]; return s / (Math.max(norm(F[a]), 1e-12) * Math.max(norm(F[b]), 1e-12)); };
    return shares(sel, sel.map(function (c) { return cos(c, j); }));
  }
  function recommendFromItems(chosen) {
    var D = state.D, n = D.catalogue.length;
    var sel = chosen.slice().sort(function (a, b) { return a - b; });
    var isChosen = {}; sel.forEach(function (c) { isChosen[c] = true; });
    var out = {};
    var pop = [];
    for (var p = 0; p < n && pop.length < TOP_K; p++) if (!isChosen[p]) pop.push({ i: D.catalogue[p], w: [] });
    out.popularity = pop;
    ["itemknn", "itemknn_recency", "ease", "copurchase"].forEach(function (m) {
      if (D.lists[m]) out[m] = neighbourRecs(D.lists[m], sel, n, null);
    });
    if (D.price_weight && D.lists.copurchase) out.copurchase_price = neighbourRecs(D.lists.copurchase, sel, n, D.price_weight);

    var A = D.als, F = A.factors, dim = F[0].length, w = A.alpha * Math.log1p(1);
    var M = A.gram.map(function (r, i) { return r.map(function (v, j) { return v + (i === j ? A.reg : 0); }); });
    var b = new Array(dim).fill(0);
    sel.forEach(function (c) {
      for (var i = 0; i < dim; i++) {
        b[i] += (1 + w) * F[c][i];
        for (var j = 0; j < dim; j++) M[i][j] += w * F[c][i] * F[c][j];
      }
    });
    var pv = solve(M, b);
    var sc = F.map(function (row, j) {
      if (isChosen[j]) return -Infinity;
      var s = 0; for (var i = 0; i < dim; i++) s += row[i] * pv[i]; return s;
    });
    out.als = byScoreDesc(sc).filter(function (j) { return isFinite(sc[j]); }).slice(0, TOP_K).map(function (j) {
      return { i: j, w: unitCosShares(F, sel, j) };
    });

    var B = D.bpr, G = B.factors, mean = new Array(G[0].length).fill(0);
    sel.forEach(function (c) { for (var d = 0; d < mean.length; d++) mean[d] += G[c][d]; });
    for (var d2 = 0; d2 < mean.length; d2++) mean[d2] /= sel.length;
    var sb = G.map(function (row, j) {
      if (isChosen[j]) return -Infinity;
      var s = 0; for (var d = 0; d < row.length; d++) s += row[d] * mean[d]; return s + B.bias[j];
    });
    out.bpr = byScoreDesc(sb).filter(function (j) { return isFinite(sb[j]); }).slice(0, TOP_K).map(function (j) {
      return { i: j, w: unitCosShares(G, sel, j) };
    });
    return out;
  }

  // ---- rendering ----
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function explanation(modelKey, rec, rank) {
    var cfg = DATASETS[state.ds], box = el("div", "explain");
    var sources = rec.w || [];
    var lead = {
      popularity: "A best seller: ranked number " + (rank + 1) + " among the most popular items in the training data. Everyone gets the same list, minus what they already have.",
      itemknn: "People who picked the items below also tended to pick this one (cosine similarity of who picked what).",
      itemknn_recency: "Same idea as item-based filtering, but recent activity counted for more than old activity when similarities and scores were computed.",
      copurchase: "This item showed up in the same baskets as the items below, and the pair appeared often enough to pass the minimum support rule.",
      copurchase_price: "Co-purchase scores first (this item showed up in the same baskets as the items below), then a business rule multiplied each score by a price factor.",
      als: "Its learned taste factors point the same way as those of the items below, and it fits the profile built from them.",
      ease: "A learned item-to-item weight links the items below to this one (a linear model solved in closed form).",
      bpr: "The model learned to rank items like this one above items people did not pick; its factors are closest to the items below."
    }[modelKey];
    box.appendChild(el("p", null, lead));
    if (sources.length) {
      box.appendChild(el("p", "muted", cfg.source + ":"));
      sources.forEach(function (s) {
        var row = el("div", "src");
        row.appendChild(el("span", null, nameOf(s[0])));
        row.appendChild(el("span", "muted", Math.round(s[1] * 100) + "%"));
        var track = el("span", "track"), fill = el("span", "fill");
        fill.style.width = Math.round(s[1] * 100) + "%";
        track.appendChild(fill); row.appendChild(track);
        box.appendChild(row);
      });
      box.appendChild(el("p", "muted", "Shares show how much each item contributed to this suggestion among the top contributors."));
    } else if (modelKey !== "popularity") {
      box.appendChild(el("p", "muted", "Nothing in the history was close enough to explain this one, so it was filled in from the best sellers."));
    }
    if (modelKey === "copurchase_price" && rec.f !== undefined) {
      var price = state.D.items[rec.i][2];
      var effect = rec.f > 1.05 ? "boosted" : (rec.f < 0.95 ? "pushed down" : "left about unchanged");
      box.appendChild(el("p", null, "Price rule: unit price " + (price === null ? "unknown" : "£" + price.toFixed(2)) +
        " gave a factor of " + rec.f.toFixed(2) + ", which " + effect + " this item's position."));
    }
    return box;
  }
  function renderResults(recs) {
    var root = $("results");
    root.textContent = "";
    if (!recs) {
      root.appendChild(el("p", "empty", "Add one or more items to see recommendations."));
      return;
    }
    var cfg = DATASETS[state.ds];
    MODELS.forEach(function (m) {
      if (!recs[m.key] || !state.enabled[m.key]) return;
      var card = el("section", "card");
      card.setAttribute("data-model", m.key);
      card.appendChild(el("h3", null, m.title));
      card.appendChild(el("p", "sub", m.sub));
      var ol = el("ol", "recs");
      recs[m.key].forEach(function (r, rank) {
        var li = el("li");
        var btn = el("button", "rec-btn");
        btn.type = "button";
        btn.setAttribute("aria-expanded", "false");
        btn.appendChild(el("span", "rank", String(rank + 1)));
        var body = el("span");
        body.appendChild(el("span", "nm", nameOf(r.i)));
        if (state.ds === "retail") body.appendChild(el("span", "code", "Product code " + codeOf(r.i)));
        btn.appendChild(body);
        btn.appendChild(el("span", "why-tag", "Why?"));
        var panel = null;
        btn.addEventListener("click", function () {
          if (panel) {
            li.removeChild(panel); panel = null; btn.setAttribute("aria-expanded", "false");
          } else {
            panel = explanation(m.key, r, rank); li.appendChild(panel); btn.setAttribute("aria-expanded", "true");
          }
        });
        li.appendChild(btn);
        ol.appendChild(li);
      });
      card.appendChild(ol);
      root.appendChild(card);
    });
    if (!root.firstChild) root.appendChild(el("p", "empty", "Select at least one recommender above."));
  }

  // ---- customer mode (retail only) ----
  var sel = $("customer");
  function fillCustomers() {
    sel.textContent = "";
    (state.D.customers || []).forEach(function (c, i) {
      var o = el("option", null, c.label); o.value = String(i); sel.appendChild(o);
    });
  }
  function showCustomer() {
    var c = state.D.customers[Number(sel.value)];
    $("customer-meta").textContent = "Bought " + c.n_products + " different products in the training period; the most recent are listed below.";
    var ul = $("history"); ul.textContent = "";
    c.history.forEach(function (i) { ul.appendChild(el("li", "chip", nameOf(i))); });
    renderResults(c.recs);
  }
  sel.addEventListener("change", showCustomer);

  // ---- picker mode ----
  function showBasket() {
    var ul = $("basket"); ul.textContent = "";
    state.basket.forEach(function (i) {
      var li = el("li", "chip");
      li.appendChild(document.createTextNode(nameOf(i)));
      var x = el("button", null, "×");
      x.type = "button"; x.setAttribute("aria-label", "Remove " + nameOf(i));
      x.addEventListener("click", function () { state.basket = state.basket.filter(function (b) { return b !== i; }); showBasket(); });
      li.appendChild(x);
      ul.appendChild(li);
    });
    $("basket-count").textContent = "(" + state.basket.length + " of " + MAX_BASKET + ")";
    renderResults(state.basket.length ? recommendFromItems(state.basket) : null);
    showHits();
  }
  function showHits() {
    var q = $("search").value.trim().toLowerCase(), ul = $("hits");
    ul.textContent = "";
    if (!q || state.basket.length >= MAX_BASKET) return;
    var found = 0, n = state.D.catalogue.length;
    for (var i = 0; i < n && found < 8; i++) {
      if (state.basket.indexOf(i) !== -1) continue;
      if (nameOf(i).toLowerCase().indexOf(q) !== -1 || (state.ds === "retail" && codeOf(i).toLowerCase().indexOf(q) !== -1)) {
        found++;
        var li = el("li"), b = el("button", null, nameOf(i) + (state.ds === "retail" ? "  (" + codeOf(i) + ")" : ""));
        b.type = "button";
        b.addEventListener("click", (function (idx) { return function () {
          state.basket.push(idx); $("search").value = ""; showBasket();
        }; })(i));
        li.appendChild(b); ul.appendChild(li);
      }
    }
    if (!found) ul.appendChild(el("li", "muted", "No matching items among the " + n + " most popular."));
  }
  $("search").addEventListener("input", showHits);

  function fillPresets() {
    var row = $("presets"); row.textContent = "";
    (state.D.presets || []).forEach(function (p) {
      var b = el("button", "btn", p.label); b.type = "button";
      b.addEventListener("click", function () { state.basket = p.chosen.slice(); showBasket(); });
      row.appendChild(b);
    });
    var clear = el("button", "btn", "Clear"); clear.type = "button";
    clear.addEventListener("click", function () { state.basket = []; $("search").value = ""; showBasket(); });
    row.appendChild(clear);
  }

  // ---- model chooser ----
  (function () {
    var ul = $("model-list");
    MODELS.forEach(function (m) {
      var li = el("li"), lab = el("label"), cb = el("input");
      cb.type = "checkbox"; cb.checked = true; cb.id = "model-" + m.key;
      cb.addEventListener("change", function () { state.enabled[m.key] = cb.checked; refresh(); });
      lab.appendChild(cb); lab.appendChild(document.createTextNode(m.title));
      li.appendChild(lab); ul.appendChild(li);
    });
  })();
  function syncModelList() {
    MODELS.forEach(function (m) {
      var present = !!(state.D.meta.models.indexOf(m.key) !== -1);
      $("model-" + m.key).parentNode.parentNode.hidden = !present;
    });
  }

  // ---- modes, datasets ----
  function refresh() { if (state.mode === "customer" && state.D.customers && state.D.customers.length) showCustomer(); else showBasket(); }
  function setMode(mode) {
    var cust = mode === "customer";
    state.mode = mode;
    $("tab-customer").setAttribute("aria-selected", String(cust));
    $("tab-picker").setAttribute("aria-selected", String(!cust));
    $("mode-customer").hidden = !cust;
    $("mode-picker").hidden = cust;
    refresh();
  }
  function applyDataset(key) {
    var cfg = DATASETS[key];
    state.ds = key; state.D = cfg.get(); state.basket = [];
    Object.keys(DATASETS).forEach(function (k) { $(DATASETS[k].tab).setAttribute("aria-selected", String(k === key)); });
    var hasCustomers = !!(state.D.customers && state.D.customers.length);
    $("tab-customer").hidden = !hasCustomers;
    $("search-label").textContent = cfg.search;
    $("search").placeholder = cfg.placeholder; $("search").value = "";
    $("basket-title").firstChild.nodeValue = cfg.basket + " ";
    $("footer").textContent = "";
    $("footer").appendChild(el("p", null, cfg.footer + " In picker mode the page recomputes suggestions in your browser from the " +
      state.D.catalogue.length + " most popular items, using each item's nearest neighbours for the neighbourhood models and the exported factors for the factor models. Suggestions are illustrative."));
    fillCustomers(); fillPresets(); syncModelList();
    $("status").textContent = "";
    setMode(hasCustomers ? "customer" : "picker");
  }
  function loadDataset(key) {
    var cfg = DATASETS[key];
    if (cfg.get()) { applyDataset(key); return; }
    $("status").textContent = "Loading the " + (key === "books" ? "book" : "shop") + " data...";
    var s = document.createElement("script");
    s.src = cfg.file;
    s.onload = function () { applyDataset(key); };
    s.onerror = function () { $("status").textContent = "Could not load " + cfg.file + "."; };
    document.head.appendChild(s);
  }
  $("tab-customer").addEventListener("click", function () { setMode("customer"); });
  $("tab-picker").addEventListener("click", function () { setMode("picker"); });
  $("ds-retail").addEventListener("click", function () { loadDataset("retail"); });
  $("ds-books").addEventListener("click", function () { loadDataset("books"); });

  // The same maths as the Python reference; compares against the numbers it produced when the data was built.
  function selfCheck() {
    var report = [];
    Object.keys(DATASETS).forEach(function (key) {
      var D = DATASETS[key].get();
      if (!D) return;
      var keep = state.D; state.D = D;
      D.selfcheck.forEach(function (c, n) {
        var got = recommendFromItems(c.chosen);
        Object.keys(c.expected).forEach(function (m) {
          var a = got[m].map(function (r) { return r.i; }).join(","), b = c.expected[m].map(function (r) { return r.i; }).join(",");
          var wa = got[m].map(function (r) { return r.w.length ? r.w[0][0] : -1; }).join(","), wb = c.expected[m].map(function (r) { return r.w.length ? r.w[0][0] : -1; }).join(",");
          report.push({ dataset: key, basket: n, model: m, itemsMatch: a === b, topSourceMatches: wa === wb });
        });
      });
      state.D = keep;
    });
    return report;
  }

  window.ecomDemo = { state: state, recommendFromItems: recommendFromItems, selfCheck: selfCheck, loadDataset: loadDataset };
  applyDataset("retail");
})();
</script>
</body>
</html>
